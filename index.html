<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evelyn Nguyen Portfolio</title>
<style>
/* Layout: minimal editorial. White hero with a large serif name and fine rule; "Selected Work" as a taupe band holding light project cards; skills in three columns split by hairlines; contact in a soft beige box. Pill buttons with 1px borders. Max width 1240px. Light theme only. */
:root {
  --bg:#FDFDFD; --ink:#3E342E; --muted:#6D625C; --accent:#73564B;
  --band:#C4AFA7; --line:#D7C7BE; --btn-line:#AD9487; --hover:#EEE7E1;
  --surface:#F6F1ED; --chart:#AD9487; --scrim:rgba(62,52,46,.55);
  --shadow:0 18px 40px -28px rgba(62,52,46,.45);
  color-scheme:light;
  --f-display:Georgia,"Times New Roman",serif;
  --f-body:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs-hero:clamp(35px,4.6vw,54px);
  --fs-work:clamp(45px,6.2vw,72px);
  --fs-section:clamp(29px,3.2vw,38px);
  --fs-body:clamp(16px,1.15vw,17px);
  --fs-ui:clamp(14px,1vw,15px);
  --fs-meta:clamp(13px,.95vw,14px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-body);line-height:1.78}
body.locked{overflow:hidden}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;color:var(--ink);letter-spacing:-.005em}
.label{font-size:var(--fs-meta);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;line-height:1.5}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.brand{font-family:var(--f-display);font-size:1.15rem;text-decoration:none;color:var(--ink)}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.nav ul a{color:var(--muted);text-decoration:none;font-size:var(--fs-ui)}
.nav ul a:hover,.nav ul a.main{color:var(--ink)}
@media (max-width:600px){.nav ul{gap:16px}.nav .hide-sm{display:none}}

/* Hero */
.hero-outer{padding:0}
.hero{position:relative;background:var(--bg)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end;padding-block:96px 0}
.hero.solo .wrap{grid-template-columns:1fr;padding-block:104px 96px}
.hero-text{min-width:0;padding-bottom:72px}
.hero.solo .hero-text{padding-bottom:0;text-align:center;max-width:46em;margin:0 auto}
.hero.solo .intro{margin-left:auto;margin-right:auto}
.hero.solo .cta{justify-content:center}
.hero h1{font-size:var(--fs-hero);line-height:1.12;margin:0 0 24px}
.hero .intro{margin:0 0 36px;color:var(--muted);max-width:40em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 26px;border-radius:999px;font:500 var(--fs-ui)/1.4 var(--f-body);text-decoration:none;cursor:pointer;border:1px solid var(--btn-line);background:transparent;color:var(--ink);transition:background-color .2s,border-color .2s}
.btn:hover{background:var(--hover)}
.btn.white{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.white:hover{background:var(--accent);border-color:var(--accent)}
.portrait{justify-self:end;align-self:end;width:100%;max-width:460px}
.portrait img{width:100%;height:auto;display:block}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;gap:0;padding-block:56px 0}
  .hero.solo .wrap{padding-block:64px 56px}
  .portrait{justify-self:center;max-width:340px}
  .hero-text{padding-bottom:32px}
}

section.block>.wrap{padding-block:88px}
section.minor>.wrap{padding-block:80px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:40px}
h2{font-size:var(--fs-section);line-height:1.2;margin:0}
.sec-head p{margin:0;color:var(--muted);max-width:36em}

/* Selected Work band */
#work{background:var(--band)}
#work>.wrap{padding-block:88px 96px}
#work h2{font-size:var(--fs-work);line-height:1.05}
.projects{display:grid;gap:28px}
.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:center;padding:20px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-2px)}}
.card-body{min-width:0;padding-right:16px}
.frame{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.frame iframe,.frame>img{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.frame>img{object-fit:cover;object-position:top left}
.wire{position:absolute;inset:0;display:grid;grid-template-rows:auto auto 1fr;gap:4%;padding:5%}
.wire .t{font-family:var(--f-display);color:var(--ink);font-size:clamp(.8rem,1.3vw,1rem)}
.wire .k{display:grid;grid-template-columns:repeat(4,1fr);gap:3%}
.wire .k span,.wire .v span{background:var(--bg);border:1px solid var(--line);border-radius:3px;min-height:2.2em}
.wire .v{display:grid;grid-template-columns:1.5fr 1fr;gap:3%}
.wire .v span{position:relative;overflow:hidden}
.wire .v span:first-child::after{content:"";position:absolute;left:6%;right:6%;bottom:12%;height:50%;background:linear-gradient(to top right,transparent 49%,var(--chart) 50%,transparent 52%)}
.vid{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:16px;padding:6%;text-align:center}
.vid .t{font-family:var(--f-display);color:var(--ink);font-size:clamp(.9rem,1.5vw,1.15rem)}
.play,.play-on{width:60px;height:60px;border-radius:50%;background:var(--bg);border:1px solid var(--btn-line);position:relative}
.play::after,.play-on::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-35%,-50%);border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent var(--accent)}
.play-on{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.frame>.play-on{display:none}
.frame>img+.play-on{display:block}
.note{position:absolute;right:3%;bottom:4%;font-size:clamp(9px,1vw,12px);background:var(--bg);color:var(--accent);border:1px solid var(--line);padding:.25em .9em;border-radius:999px}
.card h3{font-size:clamp(26px,2.6vw,34px);line-height:1.2;margin:0 0 12px}
.card p.sum{margin:0 0 20px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:var(--fs-meta);padding:3px 13px;border-radius:999px;color:var(--accent);border:1px solid var(--line);line-height:1.6}
.card-foot{margin-top:26px}
.more{display:flex;justify-content:center;margin-top:40px}
.more .btn{background:var(--bg)}
@media (max-width:760px){.card{grid-template-columns:1fr;gap:20px;padding:14px}.card-body{padding:0 4px 8px}}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:1240px;background:var(--bg);color:var(--ink);border-radius:6px;padding:28px 32px 34px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.sheet-head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:var(--fs-section);line-height:1.15;margin:0}
.close{flex:none;font:500 var(--fs-ui) var(--f-body);background:transparent;border:1px solid var(--btn-line);color:var(--ink);border-radius:999px;padding:8px 20px;cursor:pointer}
.close:hover{background:var(--hover)}
.notes{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:36px;margin-top:28px}
.notes>div{min-width:0}
.notes p{margin:0 0 14px;color:var(--muted)}
.notes dl{margin:0;display:grid;gap:16px}
.notes dt{font-size:var(--fs-meta);font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
.notes dd{margin:2px 0 0;color:var(--muted)}
.impact{display:flex;gap:10px;align-items:baseline;padding:12px 16px;background:var(--hover);border-radius:4px;margin-bottom:14px}
.impact b{font-family:var(--f-display);font-weight:400;font-size:1.8rem;color:var(--accent);font-variant-numeric:tabular-nums}
.insights{margin-top:30px;padding:26px 28px;background:var(--surface);border-radius:4px}
.insights ul{margin:8px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:14px 36px}
.insights li{position:relative;padding-left:20px;font-variant-numeric:tabular-nums}
.insights li::before{content:"";position:absolute;left:0;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
@media (max-width:760px){.insights ul{grid-template-columns:1fr}.insights{padding:20px}}
a.open{font-size:var(--fs-ui);text-decoration:none;border-bottom:1px solid var(--btn-line)}
a.open:hover{border-color:var(--accent)}
@media (max-width:860px){.notes{grid-template-columns:1fr;gap:20px}.sheet{padding:18px}}

/* Skills */
#skills .sec-head{margin-bottom:8px}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:48px}
.skill{padding-block:26px;border-top:1px solid var(--line)}
.skill h3{font-size:1.25rem;margin:0 0 8px}
.skill p{margin:0;color:var(--muted)}
@media (max-width:760px){.skills{grid-template-columns:1fr}}
.certs{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
.cert{display:inline-flex;gap:10px;align-items:center;padding:6px 16px 6px 6px;border-radius:999px;border:1px solid var(--btn-line);font-size:var(--fs-ui);color:var(--ink);text-decoration:none}
.cert code{font-family:var(--f-body);font-size:var(--fs-meta);font-weight:600;background:var(--hover);color:var(--accent);padding:2px 10px;border-radius:999px}

/* Contact */
#contact>.wrap{padding-top:0}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;background:var(--hover);border-radius:6px;padding:48px}
.contact p{color:var(--muted);max-width:44ch;margin:12px 0 0}
.links{display:grid}
.link{display:grid;grid-template-columns:7em 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.link:last-child{border-bottom:0}
.link .lbl{font-size:var(--fs-meta);font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.link .val{overflow-wrap:anywhere;min-width:0;color:var(--ink)}
.link a.val{text-decoration:none;color:var(--accent)}
.link a.val:hover{text-decoration:underline}
.copy{font:500 var(--fs-meta) var(--f-body);background:var(--bg);border:1px solid var(--btn-line);color:var(--ink);border-radius:999px;padding:5px 15px;cursor:pointer}
.copy:hover{background:var(--surface)}
@media (max-width:760px){.contact{grid-template-columns:1fr;gap:20px;padding:26px}.link{grid-template-columns:5.5em 1fr auto}}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:28px 32px;color:var(--muted);font-size:var(--fs-meta);text-align:center}
</style>
</head><body>

const e = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = u => e(String(u).replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""));

// Cards show a screenshot of the report's first page. The viewer shows the live, interactive report.
function frame(p, live) {
  if (p.kind === "video" && p.video) {
    if (live && HOSTED) return `<iframe title="${e(p.title)}" src="https://www.youtube-nocookie.com/embed/${e(p.video)}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    const thumb = p.image || `https://i.ytimg.com/vi/${e(p.video)}/hqdefault.jpg`;
    return `<div class="vid" aria-hidden="true"><span class="t">${e(p.title)}</span><span class="play"></span></div><img src="${thumb}" alt="Video thumbnail for ${e(p.title)}" onerror="this.remove()"><span class="play-on"></span>` +
      (live ? `<span class="note">Video plays on the hosted site</span>` : "");
  }
  if (live && HOSTED && p.embedUrl) return `<iframe title="${e(p.title)}" src="${e(p.embedUrl)}" loading="lazy" allowfullscreen></iframe>`;
  if (p.image) return `<img src="${e(p.image)}" alt="First page of ${e(p.title)}">` + (live && p.embedUrl ? `<span class="note">Interactive report loads on the hosted site</span>` : "");
  return `<div class="wire" aria-label="Report placeholder"><span class="t">${e(p.title)}</span><div class="k"><span></span><span></span><span></span><span></span></div><div class="v"><span></span><span></span></div></div>` +
    `<span class="note">${p.embedUrl ? "Live report loads on the hosted site" : "Add a Publish to web link"}</span>`;
}

function card(p, i) {
  return `<article class="card" id="project-${i + 1}" data-i="${i}"${i >= FEATURED ? " hidden" : ""}>
    <div class="frame">${frame(p, false)}</div>
    <div class="card-body"><p class="label">${e(p.tag)}</p><h3>${e(p.title)}</h3><p class="sum">${e(p.summary)}</p>
      ${p.stack.length ? `<div class="chips">${p.stack.map(s => `<span>${e(s)}</span>`).join("")}</div>` : ""}
      <div class="card-foot"><button class="btn primary" type="button">${p.kind === "video" ? "Watch demo" : "View dashboard"}</button></div>
    </div></article>`;
}

function sheet(p) {
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="sheet-head"><div><p class="label">${e(p.tag)}</p><h3 id="viewer-title">${e(p.title)}</h3></div><button class="close" type="button" id="viewer-close">Close</button></div>
    <div class="frame">${frame(p, true)}</div>
    <div class="notes">
      <div><p>${e(p.summary)}</p>
        ${p.liveUrl || p.embedUrl ? `<a class="open" href="${e(p.liveUrl || p.embedUrl)}" target="_blank" rel="noopener">${p.kind === "video" ? "Watch on YouTube ↗" : "Open full screen ↗"}</a>` : ""}</div>
      <div>${p.problem || p.approach ? `<dl>${p.problem ? `<div><dt>Question</dt><dd>${e(p.problem)}</dd></div>` : ""}${p.approach ? `<div><dt>What I built</dt><dd>${e(p.approach)}</dd></div>` : ""}</dl>` : ""}</div>
      <div>${p.impact ? `<div class="impact"><b>${e(p.impact[0])}</b><span>${e(p.impact[1])}</span></div>` : ""}
        ${p.stack.length ? `<div class="chips">${p.stack.map(s => `<span>${e(s)}</span>`).join("")}</div>` : ""}</div>
    </div>
    ${p.insights && p.insights.length ? `<div class="insights"><p class="label">Key insights</p><ul>${p.insights.map(t => `<li>${e(t)}</li>`).join("")}</ul></div>` : ""}
    </div>`;
}

  <div class="sec-head"><h2>Selected Work</h2></div>
  <div class="projects">${S.projects.map(card).join("")}</div>
  ${n > FEATURED ? `<div class="more"><button class="btn soft" type="button" id="see-all" aria-expanded="false">View all projects</button></div>` : ""}
</div></section>

<section class="block minor" id="skills"><div class="wrap"><div class="sec-head"><h2>Skills &amp; certificates</h2></div>
  <div class="skills">${S.skills.map(g => `<div class="skill"><h3>${e(g.group)}</h3><p>${g.items.map(e).join(" · ")}</p></div>`).join("")}</div>
  ${S.certs.length ? `<div class="certs">${S.certs.map(c => c.url ? `<a class="cert" href="${e(c.url)}" target="_blank" rel="noopener"><code>${e(c.code)}</code>${e(c.name)} ↗</a>` : `<span class="cert"><code>${e(c.code)}</code>${e(c.name)}</span>`).join("")}</div>` : ""}
</div></section>

<section class="block minor" id="contact"><div class="wrap"><div class="contact"><div><h2>Let's talk</h2><p>${e(C.intro)}</p></div><div class="links">${links}</div></div></div></section>
<footer><div class="wrap">${e(S.name)} · Finance analytics portfolio</div></footer>
<div class="viewer" id="viewer" hidden></div>`;

// Report viewer
const viewer = document.getElementById("viewer");
let lastFocus = null;
function openReport(i) {
  lastFocus = document.activeElement;
  viewer.innerHTML = sheet(S.projects[i]);
  viewer.hidden = false;
  document.body.classList.add("locked");
  document.getElementById("viewer-close").focus();
}
function closeReport() {
  viewer.hidden = true;
  viewer.innerHTML = "";
  document.body.classList.remove("locked");
  if (lastFocus) lastFocus.focus();
}
document.querySelector(".projects").addEventListener("click", ev => {
  const c = ev.target.closest(".card");
  if (c) openReport(+c.dataset.i);
});
viewer.addEventListener("click", ev => {
  if (ev.target === viewer || ev.target.id === "viewer-close") closeReport();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !viewer.hidden) closeReport(); });

const seeAll = document.getElementById("see-all");
if (seeAll) seeAll.addEventListener("click", () => {
  const open = seeAll.getAttribute("aria-expanded") !== "true";
  document.querySelectorAll(".projects .card").forEach((a, i) => { if (i >= FEATURED) a.hidden = !open; });
  seeAll.setAttribute("aria-expanded", String(open));
  seeAll.textContent = open ? "Show fewer" : "View all projects";
  if (open) document.getElementById(`project-${FEATURED + 1}`).scrollIntoView({ block: "start" });
  else document.getElementById("work").scrollIntoView({ block: "start" });
});

const btn = document.getElementById("copy-email");
if (btn) btn.addEventListener("click", () => {
  const el = document.getElementById("email");
  const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; };
  try { navigator.clipboard.writeText(el.textContent).then(() => btn.textContent = "Copied", sel); } catch (_) { sel(); }
  setTimeout(() => btn.textContent = "Copy", 1600);
});
</script>
</body></html>
